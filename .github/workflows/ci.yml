name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1 tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Validate Lua syntax
        run: |
          find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run Luacheck
        run: luacheck .

      - name: Run addon tests
        run: |
          lua5.1 test/character_spec.lua
          lua5.1 test/realm_identity_spec.lua
          lua5.1 test/telemetry_schema_spec.lua
          lua5.1 test/session_capture_spec.lua

      - name: Validate TOC file manifest
        shell: bash
        run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" ]] && continue
            [[ "$line" == '##'* ]] && continue
            [[ "$line" == '#'* ]] && continue
            [[ "$line" == 'Data/BridgeInbox.generated.lua' ]] && continue

            if [[ ! -f "$line" ]]; then
              echo "Guildweaver.toc references missing file: $line"
              exit 1
            fi
          done < Guildweaver.toc